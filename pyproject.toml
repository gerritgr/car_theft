[project]
name = "car-theft"
version = "0.1.0"
description = "Spatio-temporal analysis of NYC Vehicle Collisions data following a minimal Cookiecutter Data Science (CCDS) framework."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    "torch>=2.4.0",
    "scikit-learn>=1.5.0",
    "jupyterlab>=4.2.0",
    "tsl @ git+https://github.com/TorchSpatiotemporal/tsl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/car_theft"]

[tool.uv]
dev-dependencies = []
